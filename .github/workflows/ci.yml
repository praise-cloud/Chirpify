name: "CI - Continuous Integration & Quality Gate"

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "docker/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

# Concurrency group: Cancel redundant in-flight builds on new commits to save pipeline compute costs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Static Code Analysis & Linting (Shift-Left Quality)
  # ----------------------------------------------------------------------------
  lint:
    name: "Code Lint & Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Linting Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: "Run Ruff Lint Check"
        run: |
          ruff check src/ tests/

  # ----------------------------------------------------------------------------
  # Job 2: Automated Unit & Integration Testing
  # ----------------------------------------------------------------------------
  test:
    name: "Automated Test Suite"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Project Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Pytest Suite"
        env:
          USE_MOCK_QUEUE: "true"
          ENVIRONMENT: "test"
        run: |
          python -m pytest tests/ -v --durations=10

  # ----------------------------------------------------------------------------
  # Job 3: Container Vulnerability Scanning (DevSecOps with Trivy)
  # ----------------------------------------------------------------------------
  security-scan:
    name: "Trivy Container Security Scan"
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        include:
          - service: "api"
            dockerfile: "docker/Dockerfile.api"
          - service: "worker"
            dockerfile: "docker/Dockerfile.worker"
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Build Docker Image Locally for Inspection"
        run: |
          docker build -f ${{ matrix.dockerfile }} -t chirpify-${{ matrix.service }}:${{ github.sha }} .

      - name: "Run Aquasecurity Trivy Vulnerability Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "chirpify-${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          exit-code: "0" # Non-blocking on initial scan, logs findings
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
