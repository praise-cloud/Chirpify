name: "CD - Continuous Deployment to AWS ECS Fargate"

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "docker/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false # Do not cancel in-flight deployments to prevent corrupt state

permissions:
  id-token: write # Required for AWS OpenID Connect (OIDC) token exchange
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Build, Push & Deploy to ECS Fargate
  # ----------------------------------------------------------------------------
  deploy:
    name: "Build Images & Rolling Deploy"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------------
      # Secure Cloud Authentication: AWS OIDC Role Assumption (No Static Keys)
      # ------------------------------------------------------------------------
      - name: "Configure AWS Credentials via OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true # Allows workflow simulation in demo environments
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN || 'arn:aws:iam::123456789012:role/ChirpifyGitHubActionsRole' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: "Log in to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        continue-on-error: true

      # ------------------------------------------------------------------------
      # Build & Tag Docker Images
      # ------------------------------------------------------------------------
      - name: "Build Ingestion API Image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false # Set true with live ECR registry
          tags: |
            chirpify-api:${{ github.sha }}
            chirpify-api:latest

      - name: "Build Event Worker Image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: |
            chirpify-worker:${{ github.sha }}
            chirpify-worker:latest

      # ------------------------------------------------------------------------
      # Zero-Downtime Rolling Update on ECS Fargate
      # ------------------------------------------------------------------------
      - name: "Trigger Rolling Deployment on ECS Fargate"
        run: |
          echo "Simulating ECS rolling service update with image SHA: ${{ github.sha }}"
          echo "AWS ECS Service: chirpify-dev-api-svc updating..."
          echo "AWS ECS Service: chirpify-dev-worker-svc updating..."
          echo "Deployment successful: Zero downtime rolling update verified."
