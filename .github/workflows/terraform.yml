name: "Terraform - Infrastructure as Code GitOps"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Terraform Format & Syntax Validation
  # ----------------------------------------------------------------------------
  validate:
    name: "Terraform Format & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: "Terraform Format Check"
        run: |
          terraform fmt -check -recursive terraform/

      - name: "Initialize Terraform (Validation Mode)"
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false

      - name: "Validate Terraform Configuration"
        working-directory: terraform/environments/dev
        run: |
          terraform validate

  # ----------------------------------------------------------------------------
  # Job 2: Terraform Speculative Plan (PR Feedback)
  # ----------------------------------------------------------------------------
  plan:
    name: "Terraform Speculative Plan"
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'pull_request'
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: "Initialize Terraform"
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false

      - name: "Execute Speculative Plan"
        id: plan
        working-directory: terraform/environments/dev
        env:
          TF_VAR_use_local_floci: "true"
          TF_VAR_floci_endpoint: "http://localhost:4566"
        run: |
          terraform plan -no-color || true
