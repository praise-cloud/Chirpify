services:
  # ----------------------------------------------------------------------------
  # FastAPI Ingestion API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: chirpify-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/chirpify-events-queue
      - USE_MOCK_QUEUE=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=chirpify_user
      - POSTGRES_PASSWORD=chirpify_secure_pass
      - POSTGRES_DB=chirpify_analytics
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chirpify-net

  # ----------------------------------------------------------------------------
  # Event Consumer Worker Service
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: chirpify-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/chirpify-events-queue
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=chirpify_user
      - POSTGRES_PASSWORD=chirpify_secure_pass
      - POSTGRES_DB=chirpify_analytics
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chirpify-net

  # ----------------------------------------------------------------------------
  # LocalStack: Emulates AWS Cloud Services (SQS, S3) Locally
  # ----------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3.4
    container_name: chirpify-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3
      - AWS_DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chirpify-net

  # ----------------------------------------------------------------------------
  # PostgreSQL: Relational Storage & Analytical Aggregates
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chirpify-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chirpify_user
      POSTGRES_PASSWORD: chirpify_secure_pass
      POSTGRES_DB: chirpify_analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpify_user -d chirpify_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chirpify-net

  # ----------------------------------------------------------------------------
  # Redis: In-Memory Hot Cache & Real-Time Counters
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chirpify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - chirpify-net

volumes:
  postgres-data:
  redis-data:

networks:
  chirpify-net:
    driver: bridge
